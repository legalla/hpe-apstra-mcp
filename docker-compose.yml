services:
  hpe-apstra-mcp:
    build: .
    image: hpe-apstra-mcp:latest
    container_name: hpe-apstra-mcp
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      # SSE transport (network) — use "stdio" for local usage
      MCP_TRANSPORT:     streamable-http
      MCP_HOST:          0.0.0.0
      MCP_PORT:          "8000"
      # Apstra credentials (overridden by the .env file if present)
      APSTRA_HOST:       "192.168.8.1"
      APSTRA_USERNAME:   "admin"
      APSTRA_PASSWORD:   "secret"
      APSTRA_VERIFY_SSL: false
      # Bearer authentication of the MCP client to this server (see README §Security).
      # Disabled by default. Set to true after creating at least one token.
      APSTRA_AUTH_ENABLED:        "${APSTRA_AUTH_ENABLED:-false}"
      APSTRA_TOKENS_FILE:         "/app/secrets/.tokens"
      # Set to true ONLY behind a trusted reverse-proxy.
      APSTRA_TRUST_FORWARDED_FOR: "${APSTRA_TRUST_FORWARDED_FOR:-false}"
    volumes:
      # Read-write volume containing the named Bearer tokens (.tokens).
      - ./secrets:/app/secrets
    # Uncomment if Apstra is on the local network of the Docker server:
    # network_mode: host
